<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="robots" content="index, follow">
{% if page.tags %}<meta name="keywords" content="{{ page.tags | join: ', ' }}">{% endif %}

<!-- Google Search Console verification: paste the <meta name="google-site-verification" ...> tag Google gives you on the NEXT line, then push. -->
<!-- GSC-VERIFY -->
<link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style.css">
<link rel="sitemap" type="application/xml" title="Sitemap" href="{{ site.baseurl }}/sitemap.xml">
<link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ site.baseurl }}/feed.xml">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📺</text></svg>">

<!-- jekyll-seo-tag generates title, description, canonical, Open Graph,
     Twitter cards and JSON-LD structured data (whitelisted on GitHub Pages) -->
{% seo %}
